name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A new push replaces the run already going for that same pull request or branch.
# github.ref is refs/pull/<number>/merge on a pull request, so two forks that both
# use a branch named patch-1 do not cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Node (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Smoke test
        if: runner.os != 'Windows'
        run: bash scripts/smoke.sh

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # build.rs (via tauri.conf.json) wants the Node sidecar and the bundled
      # app files. `cargo check` runs that script, so stage them first.
      - name: Stage the sidecar and app files
        run: node scripts/stage-desktop.mjs

      # The installed app runs these staged files, not the repo: make sure they work on their own.
      - name: Smoke test the staged app
        run: node scripts/smoke-staged.mjs

      - name: Check the menu bar app
        working-directory: src-tauri
        run: cargo check --locked

  website:
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - id: website
        run: |
          if [ -f website/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No website/package.json in this checkout."
          fi

      - if: steps.website.outputs.present == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - if: steps.website.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - if: steps.website.outputs.present == 'true'
        name: Build website
        working-directory: website
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi
          pnpm run build
