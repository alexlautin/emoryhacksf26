name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-arm64
            bundles: dmg
            extension: dmg
          - os: macos-15-intel
            platform: macos-x64
            bundles: dmg
            extension: dmg
          - os: windows-latest
            platform: windows-x64
            bundles: nsis
            extension: exe
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Check release version
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const pkg = JSON.parse(fs.readFileSync('package.json'));
          const config = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json'));
          assert.equal(config.version, pkg.version);
          if (process.env.GITHUB_REF_TYPE === 'tag') assert.equal(process.env.GITHUB_REF_NAME, `v${pkg.version}`);
          JS
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Build native installer with bundled Node
        run: pnpm desktop:build --bundles ${{ matrix.bundles }} --ci
      - name: Collect installer
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          const root = 'src-tauri/target/release/bundle';
          const files = fs.readdirSync(root, { recursive: true }).filter(f => f.endsWith(`.${process.env.EXTENSION}`));
          if (files.length !== 1) throw new Error(`Expected one installer, found ${files.length}: ${files}`);
          fs.mkdirSync('dist', { recursive: true });
          fs.copyFileSync(path.join(root, files[0]), `dist/Harness-${process.env.PLATFORM}.${process.env.EXTENSION}`);
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: harness-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: harness-*
          path: dist
          merge-multiple: true
      - name: Publish all installers together
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum Harness-* > SHA256SUMS.txt
          cd ..
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Harness $GITHUB_REF_NAME" --notes-file .github/release-notes.md
